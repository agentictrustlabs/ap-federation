# ap-federation's register — the neutral ground, and the estates that project onto it (spec 439 F1).
#
# Nothing in this file grants anything. A row says an estate projects a commitment to its live set, and a
# presentation against that root is EVIDENCE: whether the receiving estate lets an agent act is its own
# mandate, verified per step (ADR-0056 / ADR-0057).
federation: faithchain-neutral-ground

# ── NEUTRAL GROUND ────────────────────────────────────────────────────────────────────────────────────
# NEUTRAL IS A PROPERTY OF THE CONTRACT, NOT OF THE CHAIN IT SITS ON. `EstateProjectionRegistry` has no
# admin, no pause and no upgrade, so the account that deployed it holds nothing over it and no estate can
# redeploy the registry it proves itself against. That is the whole claim.
#
# AND THE HONEST LIMIT: this instance sits on faithchain, the one chain we run, beside both estates that
# use it. So what is proven today is CROSS-ESTATE, not cross-chain. The id is `keccak256("eip155:<chainId>:
# <governance>")` — chain-scoped by construction — so an estate on a second chain registers here unchanged
# and the verifier's code does not move; until a second chain exists, nobody may claim it has been shown.
registry:
  chainId: 34348
  chain: faithchain
  address: "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
  deployed: 2026-10-13
  deployTx: script/DeployEstateProjectionRegistry.s.sol (Ring 0 packages/contracts)
  # The RPC is read from this environment variable — never written here (it carries an app token).
  rpcEnv: FEDERATION_RPC_URL
  # Ring 0 `deployments-faithchain.json#estateProjectionRegistry` carries the same address. It is repeated
  # here because the pinned `@agenticprimitives/contracts` release predates the deployment: when a release
  # carries it, this field becomes a cross-check, not a source.
  source: ring-0 deployments-faithchain.json (2026-10-13)

# ── THE ESTATES ───────────────────────────────────────────────────────────────────────────────────────
# `governance` is the address the estate id is derived from, and it is FOREVER: change it and the estate id
# changes, which means re-registering and invalidating every reference a counterparty holds. So it is the
# one identity an estate cannot rotate — its own agent's Smart Agent address (ADR-0010: canonical identity
# persists, credentials rotate). An estate without such an agent is NOT registered here: minting a
# permanent id from a provisional address is the kind of thing nobody can undo.
estates:
  - id: imbnet
    chainId: 34348
    home: https://www.impact-agent.me
    a2a: https://a2a.impact-agent.io
    governance: "0x4457aadf6ADeB31bA8F166fafcC0d0579ECd1015"
    governanceKind: estate-agent
    governanceName: imbnet.estate          # on-chain: AgentNameRegistry owner of `imbnet.estate`
    # The key that anchors this estate's roots. `register` binds it once; `rotateSigner` moves it. The
    # address is public by construction (the registry stores it); the key is this estate's own secret.
    # THE SIGNER IS THE ESTATE'S REGISTRY AGENT (spec 439 §4, 2026-10-14) — a Smart Agent custodied by a person OF THIS
    # ESTATE (maya, through impact-agent.me), declaring `atl:estate: imbnet.estate`. `signerOf` on neutral ground is
    # this account, so anchoring is an act of the estate's own agent, not of a key somebody holds.
    signer: "0x432FE71eAB5442220Cb0CBb6974f741093De8Bd7"
    signerKind: registry-agent
    signerCustodian: "maya (a person of this estate, via its Home)"
    # The key the projector holds is a DELEGATE under a wire this agent signed: `setRoots` on the registry, nothing
    # else, time-bounded, revocable on chain in one transaction without touching the agent (ADR-0019).
    anchorDelegateKeyEnv: IMBNET_PROJECTION_SIGNER
    anchoringWire: .secrets/anchoring-wire-imbnet.json
    # Revocation is read on the ESTATE'S chain, and this is the contract that answers (Ring 0
    # `deployments-faithchain.json#delegationManager`). No address here means nothing can be pruned, and the
    # projector then refuses to vouch for a set it cannot narrow.
    delegationManager: "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
    # Where the estate agent declares `atl:projectionSigner` (spec 439 F2.5; Ring 0 deployments-faithchain.json#agentProfileResolver).
    profileResolver: "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
    # Its chain endpoint. Omitted = neutral ground's, which is only correct while they share a chain. An
    # estate on a second chain names its own here, and that is the only line that changes for it.
    # WHY A VERIFIER MUST CROSS-CHECK THIS. `register(estateId, signer)` is first-come-wins — public ground
    # cannot verify who governs an estate on another chain, so it cannot refuse a squatter. A verifier that
    # trusts the registry's signer alone trusts whoever registered first. So the estate also declares its
    # signer where its own chain says it: F2 registers an `atl:projectionSigner` predicate in Ring 0's
    # OntologyTermRegistry and the estate agent writes it (a verifier on another chain reads that chain —
    # public data, no trust required). Until then the declaration is this file and ap-town's town.yaml row,
    # both public and reviewed, and the projector prints the gap on every run.
    # DECLARED 2026-10-14: imbnet.estate wrote `atl:projectionSigner` = this signer on its own chain (tx 0x35045e1b…,
    # ap-home scripts/set-projection-signer.mts); `projector status` and the door read it and compare with `signerOf`.
    declaredOnChain: true

  - id: faithnet
    chainId: 34348
    home: https://www.faithnet.me
    a2a: https://a2a.faithnet.io
    # ON NEUTRAL GROUND SINCE 2026-10-14. faithnet's estate agent is PERSONA-CUSTODIED (the owner's decision: "use a
    # demo user for that agent … a type of .estate for each"): a Smart Agent at salt 2 over the demo-admin persona's
    # key (ap-home scripts/add-estate-agent-persona.mts), named `faithnet.estate` by the deployer (Ring 0
    # AddEstateName, tx 0x200393e4…), its Home in `atl:homepage`, its signer in `atl:projectionSigner`
    # (tx 0xd81334ac…). It is NOT `faith-estate.workspace` — that stays the Pulse's context agent (spec 436 §5.5),
    # one agent per estate typed .estate, one per context typed .workspace. (Proposed, not decided: the Pulse's
    # context agents become the .estate agents — spec 440 §A/ap-town 436.)
    governance: "0x3273f419FDfc7eA1Bf14372C4A9CA5fC43818F64"
    governanceKind: estate-agent
    governanceName: faithnet.estate         # on-chain: AgentNameRegistry owner of `faithnet.estate`
    governanceCustody: "demo-admin persona (demo/personas.local.json), the owner's choice 2026-10-14"
    # As imbnet: the signer is this estate's registry agent, custodied by demo-admin (a person of this estate),
    # declaring `atl:estate: faithnet.estate`. The projector's key is a revocable delegate under its wire.
    signer: "0xdfdAE0a37D35b72D8E2a4E3464087d43d0eB0b5b"
    signerKind: registry-agent
    signerCustodian: "demo-admin (a person of this estate)"
    anchorDelegateKeyEnv: FAITHNET_PROJECTION_SIGNER
    anchoringWire: .secrets/anchoring-wire-faithnet.json
    delegationManager: "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
    profileResolver: "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
    declaredOnChain: true

# ── THE DOORS (spec 439 F2) ───────────────────────────────────────────────────────────────────────────
# The federation's reference receiving doors — one in front of one estate's A2A door each. A production door is
# the estate's own edge; these are where a foreign presentation reaches an admission receipt today.
doors:
  - estate: imbnet
    url: https://door.ap-federation.faithnet.io
    target: maya-fernandes.me          # the receiving agent, through the estate's edge-addressed door
    since: 2026-10-14
  - estate: faithnet
    url: https://door-faithnet.ap-federation.faithnet.io
    target: alice.me
    since: 2026-10-14

# ── THE SCHEDULED PROJECTOR (spec 439 §4) ─────────────────────────────────────────────────────────────
# The job that keeps every estate's roots fresh: a tick every six hours that prunes against the chain, rebuilds and
# anchors on change or on age. A verifier accepts only a fresh anchored sequence, so an estate whose projector stops
# running stops being provable — this is what stops that. It holds the anchoring keys as Worker secrets and no vault;
# the destination is still the estate's own `.registry` service agent (DEPLOYER.md).
projector:
  url: https://projector.ap-federation.faithnet.io
  cron: "17 */6 * * *"
  refreshAfterSeconds: 21600          # < the shortest verifier `maxAge` (the doors' 86400)
  since: 2026-10-14

# ── THE TOWNS (spec 440 §B) ───────────────────────────────────────────────────────────────────────────
# Every town we have. A town is one chain and the estates on it (ap-town spec 429); its manifest is ITS record
# (ap-town `towns/<chain>/town.yaml`, public), and this list only says where each town's public surfaces are so
# the federation site can read them LIVE. Nothing here is copied from a manifest. A surface the site reads must be
# a custom domain: a Worker cannot fetch a same-account workers.dev host (CF-1042).
towns:
  - id: faithchain
    chainId: 34348
    status: live
    repo: agentictrustlabs/ap-town
    manifest: https://raw.githubusercontent.com/agentictrustlabs/ap-town/master/towns/faithchain/town.yaml
    agent: https://town.faithnet.io            # the town agent: /api/health · /api/town · /api/estates · /api/services · the card
    portal: https://town.faithnet.io
    naming: https://names.faithnet.io          # the naming read API (spec 430 §4) — the universal resolver asks it
    registry: https://discovery-a2a.faithnet.io
    rpc: https://rpc.faithnet.io
  - id: base-sepolia
    chainId: 84532
    status: retired
    repo: agentictrustlabs/ap-town
    manifest: https://raw.githubusercontent.com/agentictrustlabs/ap-town/master/towns/base-sepolia/town.yaml
    note: "The impact demos' town (ap-town spec 429 §12.3). Its discovery list was decommissioned 2026-10-13; the manifest stays as the record of what stood there. Not probed, not queried for names."

# ── THE SHARED KMS OPERATOR (spec 440 §A) ─────────────────────────────────────────────────────────────
# One AKCS operator at the federation scale; ONE TENANT PER ESTATE, ALWAYS — a tenant is the seed its keys derive
# from (the vault's per-person KEKs, the runtime→vault MACs, the OIDC-custody seed), so sharing one dissolves the
# estate. This is shared infrastructure with an operator of record: NOT neutral ground (someone can pause it), not a
# root, not required (`key-custody` is a port). Nothing here is a key, a token, a seed or a caller credential; the
# operator's record on the CVM is authoritative and this file says where it disagrees with itself.
kms:
  operator: ap-federation
  operatorRole: "the AKCS operator (`akcs operator …` on the CVM via `az vm run-command`) — one holder today, the owner; a second holder is a posture item (spec 407 D10)"
  repo: agentictrustlabs/faithkms
  backend: akcs
  host: akcs-pilot.faithnet.io
  hostPlanned: kms.faithnet.io               # spec 440 A5 step 3 — a federation host, not a pilot name; the pilot host stays until no caller uses it
  probe: https://akcs-pilot.faithnet.io/healthz
  attestation: null                          # spec 440 A5 step 4 — the CVM attestation, published at the operator host; null until it is
  azureResources:
    - /subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-pilot-0
    - /subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-tunnel-pilot
  # THE BILLABLE KEYS — read from the CVM (`akcs operator status`) and Azure Cost Management on 2026-10-14, not
  # assumed. ONE platform root in Key Vault Premium is the whole Azure key spend; every tenant's purpose roots and
  # every logical key (433 that day: envelope KEKs, signing delegates, MACs, OIDC-custody seeds) is CVM-wrapped
  # under it and costs nothing. A tenant or a caller never creates a Key Vault key. `billableKeyBudget` is the
  # owner's rule ("a couple of root keys") as a number the check refuses to exceed.
  platformRoots:
    - provider: azure-key-vault
      vault: kv-akcs-pilot-vrw42jcwx4      # SKU premium; public network access disabled (private link only)
      key: akcs-platform-root-wrap
      state: ACTIVE
      billable: true
  billableKeyBudget: 2
  evidence:
    checked: 2026-10-14
    logicalKeys: 433
    byProtection: { CVM_WRAPPED: 433 }
    keyVaultCostMonthToDate: "5.00 USD — one Premium HSM-protected advanced key; key operations 0.00 USD"
    note: "the Azure spend that month-to-date (323.85 USD) is compute, Bastion, Postgres, the registry and disks, not keys"
  protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
  costRule: "a couple of HSM root keys are the whole Azure spend; every agent key derives from them for free. AZURE_HSM_DIRECT is a billable Key Vault HSM key per key and is never bound by default — a caller that needs one names the estate that pays (billedTo)."
  tenants:
    - tenant: faithnet
      estate: faithnet
      town: faithchain
      backend: akcs
      # The first tenant, bound before the per-Worker rule existed: faithnet's Workers, its second deployment
      # (faithnet-b) and the service skills-a2a share its credential — spec 407 D10's finding, condition 1 OPEN.
      # From `akcs operator status` on 2026-10-14 (non-secret metadata). The first caller holds `*` — every operation
      # — which is the shared, over-broad credential of spec 407 D10; it is tolerated by the check ONLY because
      # this row says so (`sharedCredential: true`). 423 logical keys, all CVM_WRAPPED.
      callers:
        - { subject: demo-a2a-faithnet, worker: demo-a2a-faithnet, operations: ["*"], protectionLevels: [CVM_WRAPPED] }
        - { subject: skills-a2a-faithnet, worker: skills-a2a, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: field-a2a-faithnet, worker: field-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-faithnet, worker: gather27-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-churchglobal, worker: gather27-a2a-churchglobal, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: demo-bible-mcp-faithnet, worker: demo-bible-mcp-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: scripture-validator, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: coach-a2a-faithnet, worker: coach-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
      sharedCredential: true
      note: "demo-a2a-faithnet is bound with operations * — re-bind it per operation (runbook step 2) and disable it; gather27-churchglobal-faithnet is already DISABLED and not listed"
    - tenant: impact
      estate: impact
      town: base-sepolia
      backend: akcs
      # The retired demo town's estate (ap-town spec 429 §12.3). Three callers are still ACTIVE on the CVM; the
      # town is retired, so this tenant is a candidate to disable — an owner decision, listed so it is not forgotten.
      callers:
        - { subject: engage-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: field-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
      note: "3 logical keys (service-agent delegates); the town is retired — disable or keep is the owner's call"
    - tenant: imb
      estate: imbnet
      town: faithchain
      backend: akcs
      callers:
        - subject: imb-vault-2
          worker: imb-vault
          operations: [data-key-generate, data-key-unwrap, mac-generate, key-create]
          protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
          since: 2026-10-11
        - subject: imb-runtime-2
          worker: imb-runtime
          operations: [mac-generate]
          protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
          since: 2026-10-11
      note: "bound with --audiences urn:mcp:server:person --purposes '*' (one KEK purpose per person); the -2 subjects replaced imb-vault / imb-runtime, which are DISABLED on the CVM; 7 logical keys"
  conditions:
    - id: 1
      condition: "No shared caller credential — one least-privilege bind-caller per Worker per estate (closes spec 407 D10)"
      status: met
      detail: >-
        imbnet met 2026-10-11 (two callers). faithnet met 2026-10-14: the vault is
        `demo-mcp-faithnet-vault-5` and the runtime `demo-a2a-faithnet-runtime-6`, each with eleven named
        operations, and the shared `demo-a2a-faithnet` caller bound with operations ["*"] is DISABLED along with
        the nine narrowings tried on the way. Both estates' gates are green with it off (gate:pay-outward,
        gate:vault-record, f1, f2-door, federation-site, projector-freshness, f3-twin).
        WHAT ACTUALLY BLOCKED IT, after a day of wrong guesses: `RAW_32_BYTE_DIGEST`. It is disabled by default in
        faithkms and must be listed EXPLICITLY — a `*` in allowed_signing_purposes does not enable it
        (crates/akcs-auth/src/binding.rs check_signing_purpose), so the old caller had it spelled out and every
        replacement that listed only the typed purposes lost it. The loss was invisible: it surfaced nowhere in the
        Worker's logs and nowhere in the gate's own output, only as `plannerTrace.playbookUnreadable` inside an ask
        reply, after which the run asked "You have no treasury to be paying from" — a credential error wearing a
        domain question's clothes. Operations were never the cause; three attempts added operations and failed.
        RESIDUAL, named not hidden: the runtime still holds RAW_32_BYTE_DIGEST, which is a signature over bytes
        whose meaning nothing can check. Two sites need it today (ap-home apps/agent-runtime): the relayer, which
        signs EIP-155 transaction digests that no purpose in the enum describes, and the interactions-session key,
        which signs the 32-byte DEL-001 leaf digest. The first wants a typed `EIP155_TRANSACTION` purpose in
        faithkms; the second is an EIP-712 digest and should say so. Then the grant drops. Until then the custody
        key and the relay key are deliberately separate, so the blast radius of the raw grant is the relayer's own
        key and the session-leaf key, not a person's. Each Worker also still holds a superset of what it calls; the
        floor this condition asserts is per-Worker credentials and no key-rotate, key-disable or
        key-schedule-destruction, which "*" wrongly granted.
    - id: 2
      condition: "One tenant per estate; a tenant is never shared and an estate never has two"
      status: met
      detail: "checked by scripts/check-federation.mts over this record"
    - id: 3
      condition: "CVM protection levels only; AZURE_HSM_DIRECT never bound without a named payer"
      status: met
      detail: "protectionLevels above; the check refuses a caller with AZURE_HSM_DIRECT and no billedTo"
    - id: 4
      condition: "The CVM attestation document is published at the operator host and linked from this record"
      status: open
      detail: "operator action — spec 440 A5 step 4"

# ── THE UNIVERSAL NAMESPACE (spec 440 §C) ─────────────────────────────────────────────────────────────
# One namespace, rooted on ONE chain the way ENS v2 is rooted on Ethereum L1: the typed roots on the root chain are
# the federation's names. Other chains join without a second registry — an estate's naming gate is named on the
# root's priced roots (`setGate`), its residents own their names on the root chain by their own root-chain account,
# address records are keyed by chain, a reverse claim per chain is honoured only with the forward, and other chains
# resolve by proof or by reading the root chain. No town runs a parallel `.me`. The owner's decision of 2026-10-14;
# it amends docs/architecture/federated-agent-naming.md N7.
naming:
  rootChain: 34348
  rootRegistry: "0x60E949D52660A9D4143ecB0fdA56c0457f20aED9"      # AgentNameRegistry on faithchain (Ring 0 deployments-faithchain.json)
  universalResolver: "0xF343054e046A4145ccae499ECB28197394eE0798" # AgentNameUniversalResolver (the one-chain round trip, spec 222)
  roots: [me, org, team, svc, workspace, treasury, registry, church, circle, household, estate]
  resolver: https://ap-federation.faithnet.io/api/names           # wave 1: over every live town's naming read API; later waves read the root chain and its proofs
  note: "the priced roots' governor is naming.svc under the town clerk persona (ap-town spec 431) — the one trust position a shared root creates; spec 440 C7 names it, Ring 0 decides its council shape"
