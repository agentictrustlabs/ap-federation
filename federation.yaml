# ── THE SCHEDULED PROJECTOR (spec 439 §4) ─────────────────────────────────────────────────────────────
# The job that keeps every estate's roots fresh: a tick every six hours that prunes against the chain, rebuilds and
# anchors on change or on age. A verifier accepts only a fresh anchored sequence, so an estate whose projector stops
# running stops being provable — this is what stops that. It holds the anchoring keys as Worker secrets and no vault;
# the destination is still the estate's own `.registry` service agent (DEPLOYER.md).
projector:
  url: https://projector.ap-federation.faithnet.io
  cron: "17 */6 * * *"
  refreshAfterSeconds: 21600          # < the shortest verifier `maxAge` (the doors' 86400)
  since: 2026-10-14

# ── THE TOWNS (spec 440 §B) ───────────────────────────────────────────────────────────────────────────
# Every town we have. A town is one chain and the estates on it (ap-town spec 429); its manifest is ITS record
# (ap-town `towns/<chain>/town.yaml`, public), and this list only says where each town's public surfaces are so
# the federation site can read them LIVE. Nothing here is copied from a manifest. A surface the site reads must be
# a custom domain: a Worker cannot fetch a same-account workers.dev host (CF-1042).
towns:
  - id: faithchain
    chainId: 34348
    status: live
    repo: agentictrustlabs/ap-town
    manifest: https://raw.githubusercontent.com/agentictrustlabs/ap-town/master/towns/faithchain/town.yaml
    agent: https://town.faithnet.io            # the town agent: /api/health · /api/town · /api/estates · /api/services · the card
    portal: https://town.faithnet.io
    naming: https://names.faithnet.io          # the naming read API (spec 430 §4) — the universal resolver asks it
    registry: https://discovery-a2a.faithnet.io
    rpc: https://rpc.faithnet.io
    # How the federation's own Workers read this chain (a secret naming the gateway URL with an app token), and the one
    # contract a door needs there: the validator that answers for an EOA, a Smart Agent (ERC-1271) or a counterfactual one.
    rpcEnv: FEDERATION_RPC_URL
    universalSignatureValidator: "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"   # deployments-faithchain.json
  - id: hopenet
    chainId: 34349
    # The chain's LOCAL name table, read (ap-town hopenet naming, 2026-10-15). hopenet roots its names on faithchain and sells none,
    # but an estate's Home on this chain claims into this chain's registry (rich-impact.me, W10) — the resolver asks here so
    # such a name is seen, and the root's page can refuse to call it free. Spec 440 U3 is what carries the claim to the root.
    naming: https://names.hopenet.town
    status: demo
    repo: agentictrustlabs/ap-town
    manifest: https://raw.githubusercontent.com/agentictrustlabs/ap-town/master/towns/hopenet/town.yaml
    # THE SECOND TOWN, live since 2026-10-14 — the reason the twin runs across two CHAINS rather than two
    # estates on one. It shares the first town's VM, tunnel and disk and costs no new fixed line; what is its
    # own is the chain, its contracts, its Workers and its graph.
    #
    # On the town's own zone since 2026-10-15. This row named `town.impact-agent.io` for the few hours between
    # the town agent being deployed and the registry publishing `hopenet.town`'s delegation — a register that
    # points the federation site at a name which does not resolve reports a live town as down.
    agent: https://hopenet.town
    portal: https://hopenet.town
    # NO NAMING OF ITS OWN, and that is the design rather than a gap: spec 440 §C puts the universal namespace
    # on ONE root chain, so this town deploys naming contracts only as a local table for the `.estate` and
    # service names its bootstrap needs. Nothing here sells a name.
    namesRootedAt: faithchain
    # The discovery tier landed 2026-10-15 — registry, discovery MCP, indexer, connector, explorer host and the
    # town's private MCP, each on its own Worker over this chain's OWN GraphDB repository and retrieval index.
    # Its graph is empty today and honestly so: nobody holds a name on 34349 (the estate's people and service
    # agents were deployed there without names, and the universal namespace is rooted at faithchain), and the
    # indexer projects only what this chain can prove.
    registry: https://discovery-a2a.hopenet.town
    rpc: https://rpc.hopenet.town
    rpcEnv: HOPECHAIN_RPC_URL
    universalSignatureValidator: "0xa5855906C0De3813E74BEe201973071e0c844115"   # deployments-hopechain.json — NOT faithchain's address
  - id: base-sepolia
    chainId: 84532
    status: retired
    repo: agentictrustlabs/ap-town
    manifest: https://raw.githubusercontent.com/agentictrustlabs/ap-town/master/towns/base-sepolia/town.yaml
    note: "The impact demos' town (ap-town spec 429 §12.3). Its discovery list was decommissioned 2026-10-13; the manifest stays as the record of what stood there. Not probed, not queried for names."

# ── THE SHARED KMS OPERATOR (spec 440 §A) ─────────────────────────────────────────────────────────────
# One AKCS operator at the federation scale; ONE TENANT PER ESTATE, ALWAYS — a tenant is the seed its keys derive
# from (the vault's per-person KEKs, the runtime→vault MACs, the OIDC-custody seed), so sharing one dissolves the
# estate. This is shared infrastructure with an operator of record: NOT neutral ground (someone can pause it), not a
# root, not required (`key-custody` is a port). Nothing here is a key, a token, a seed or a caller credential; the
# operator's record on the CVM is authoritative and this file says where it disagrees with itself.
kms:
  operator: ap-federation
  operatorRole: "the AKCS operator (`akcs operator …` on the CVM via `az vm run-command`) — one holder today, the owner; a second holder is a posture item (spec 407 D10)"
  # WHAT THE OPERATOR ACTUALLY CUSTODIES — corrected 2026-10-14 (ap-home spec 441 §6), because the claim this
  # record carried was not reproducible. Spec 440 A4 said residents who sign in with Google, email or phone have
  # their custody seed in their estate's tenant, "so the operator custodies some residents of every town that opts
  # in". That is NOT the configuration either estate runs: both set `A2A_CUSTODY_KMS_BACKEND = "local-aes"`, so
  # custody derives from `A2A_CUSTODY_ROOT_KEY`, a Worker secret of the estate, and no resident's custody seed is
  # in any tenant. The key exists and is unused: faithnet's tenant holds exactly ONE `oidc-custodian` envelope key,
  # provisioned and never selected; impact-agent's holds none. A4 is therefore a CONDITIONAL caveat — true the day an
  # estate flips custody to its tenant, which ap-home spec 441 D4 says no estate does until that cost is decided.
  # What the operator does hold for faithnet beyond vault KEKs: its `relay` and `interactions-session` signing keys.
  custodyToday:
    personCustody: local-aes            # on EVERY estate; the estate's own Worker secret, never the tenant
    inTenant: [vault-kek, relay, interactions-session, service-agent-delegate, content-signer, attestation-signer]
    provisionedUnused: [oidc-custodian] # faithnet only, 1 key — the A4 path, built and not taken
    checked: 2026-10-14                 # `akcs operator status` keys grouped by kind+purpose, and both estates' wrangler vars
  repo: agentictrustlabs/faithkms
  backend: akcs
  host: kms.faithnet.io                      # spec 440 A5 step 3 DONE 2026-10-14 — a federation host, not a pilot name
  # BOTH HOSTS ANSWER, deliberately. A tunnel serves many hostnames, so `kms` was added beside `akcs-pilot`
  # rather than replacing it, and both estates' Workers were re-pointed and redeployed with every gate green.
  # The pilot host is RETIRING, not retired: it stays until nothing points at it, and removing it is its own
  # change. Note what did NOT move — caller tokens are minted against the issuer
  # `https://akcs-pilot.faithnet.internal`, an internal name unrelated to the public host, so re-pointing
  # invalidated no credential.
  hostRetiring: akcs-pilot.faithnet.io
  probe: https://kms.faithnet.io/healthz
  # THE CVM'S ATTESTATION (spec 440 A5 step 4), minted 2026-10-14 and served at the operator host by the
  # federation site, which holds a route for this one path while the rest of kms.faithnet.io goes down the
  # tunnel to the KMS. MAA says: sevsnpvm · azure-compliant-cvm · is-debuggable false · bootloader/SNP/microcode
  # SVN 10/27/88 · launch measurement aa7c9da55c1386e5b1653b125978beda7b3f95a85aeb0f9ddbbdb783ce05…
  #
  # IT IS A DATED STATEMENT AND THE ENDPOINT SAYS SO. MAA signs for eight hours; the launch measurement it
  # attests changes only when the VM image does. `?format=json` returns `fresh`, the window, and the
  # measurement. An expired token is still served rather than hidden — silence is not a safer answer than a
  # stale one that admits it. Re-mint with scripts/mint-cvm-attestation.mts after an image upgrade.
  #
  # THE CVM HAS NO OUTBOUND NETWORK AND NEEDS NONE. The report comes off the vTPM with no network at all (raw
  # TPM2 over /dev/tpmrm0 — the guest has libtss2 but no tpm2-tools and cannot install them), the VCEK chain
  # comes from AMD's public KDS, and the MAA call is made from the operator's workstation. MAA verifies the
  # AMD signature chain inside the report, so who posts it is not part of the claim. The NAT gateway written
  # for this (faithkms infra/bicep) stays default-off and is, on this evidence, not needed at all.
  attestation: https://kms.faithnet.io/.well-known/attestation
  azureResources:
    - /subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-pilot-0
    - /subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-tunnel-pilot
  # THE BILLABLE KEYS — read from the CVM (`akcs operator status`) and Azure Cost Management on 2026-10-14, not
  # assumed. ONE platform root in Key Vault Premium is the whole Azure key spend; every tenant's purpose roots and
  # every logical key (433 that day: envelope KEKs, signing delegates, MACs, OIDC-custody seeds) is CVM-wrapped
  # under it and costs nothing. A tenant or a caller never creates a Key Vault key. `billableKeyBudget` is the
  # owner's rule ("a couple of root keys") as a number the check refuses to exceed.
  platformRoots:
    - provider: azure-key-vault
      vault: kv-akcs-pilot-vrw42jcwx4      # SKU premium; public network access disabled (private link only)
      key: akcs-platform-root-wrap
      state: ACTIVE
      billable: true
  billableKeyBudget: 2
  evidence:
    checked: 2026-10-14
    logicalKeys: 433
    byProtection: { CVM_WRAPPED: 433 }
    keyVaultCostMonthToDate: "5.00 USD — one Premium HSM-protected advanced key; key operations 0.00 USD"
    note: "the Azure spend that month-to-date (323.85 USD) is compute, Bastion, Postgres, the registry and disks, not keys"
  protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
  costRule: "a couple of HSM root keys are the whole Azure spend; every agent key derives from them for free. AZURE_HSM_DIRECT is a billable Key Vault HSM key per key and is never bound by default — a caller that needs one names the estate that pays (billedTo)."
  tenants:
    - tenant: faithnet
      estate: faithnet
      town: faithchain
      backend: akcs
      # Re-bound 2026-10-14 TWICE: first to separate per-Worker credentials (condition 1), then through the
      # named PROFILES once the operator carried them (ap-home spec 441 §4 / D5) — 8 operations and 6, down
      # from 11 each, and not a set anyone typed. The Home's two Workers hold SEPARATE credentials and the shared
      # `demo-a2a-faithnet` caller with operations ["*"] is DISABLED, with the nine narrowings tried on the way.
      # Nine ACTIVE callers of twenty rows — a disabled row is never deleted, so the history of who could do what
      # stays readable. The seven key-public-key/key-sign callers are services that only sign for themselves.
      # From `akcs operator status` on the CVM (non-secret metadata). 423 logical keys, all CVM_WRAPPED.
      callers:
        - { subject: faithnet-vault, worker: demo-mcp-faithnet, profile: estate-vault, operations: [status, data-key-generate, data-key-unwrap, mac-generate, mac-verify, key-create, key-read, key-public-key], protectionLevels: [CVM_WRAPPED, CVM_DERIVED], since: 2026-10-14 }
        - { subject: faithnet-runtime, worker: demo-a2a-faithnet, profile: estate-runtime, operations: [status, mac-generate, mac-verify, key-read, key-public-key, key-sign], protectionLevels: [CVM_WRAPPED, CVM_DERIVED], since: 2026-10-14 }
        - { subject: skills-a2a-faithnet, worker: skills-a2a, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: field-a2a-faithnet, worker: field-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-faithnet, worker: gather27-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-churchglobal, worker: gather27-a2a-churchglobal, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: demo-bible-mcp-faithnet, worker: demo-bible-mcp-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: scripture-validator, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: coach-a2a-faithnet, worker: coach-a2a-faithnet, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
      # The runtime still holds RAW_32_BYTE_DIGEST (condition 1's residual): the relayer signs EIP-155 transaction
      # digests that no purpose in the enum describes, and the interactions-session key signs a 32-byte DEL-001 leaf
      # that is really EIP-712. Neither is the custody key.
      rawDigestGrant: [faithnet-runtime]
      note: "faithnet-b, the second deployment, has no caller of its own yet — it is the next thing this tenant owes (spec 366 R5)"
    - tenant: impact
      estate: impact
      town: base-sepolia
      backend: akcs
      # The retired demo town's estate (ap-town spec 429 §12.3). Three callers are still ACTIVE on the CVM; the
      # town is retired, so this tenant is a candidate to disable — an owner decision, listed so it is not forgotten.
      callers:
        - { subject: engage-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: field-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
        - { subject: gather27-a2a-production, operations: [key-public-key, key-sign], protectionLevels: [CVM_WRAPPED] }
      note: "3 logical keys (service-agent delegates); the town is retired — disable or keep is the owner's call"
    - tenant: imb
      estate: impact-agent
      town: faithchain
      backend: akcs
      # Re-bound 2026-10-14 to the ESTATE PROFILES (ap-home spec 441 §4 / D5) — the same two shapes every estate
      # gets, so the eleventh estate's callers are not derived by hand. The -2 pair is DISABLED; impact-agent's four
      # narrower operations were the local-aes shape, which stopped being right when its relay and interactions
      # keys moved into this tenant (441 D3).
      callers:
        - subject: imb-vault-3
          worker: imb-vault
          profile: estate-vault
          operations: [status, data-key-generate, data-key-unwrap, mac-generate, mac-verify, key-create, key-read, key-public-key]
          protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
          since: 2026-10-14
        - subject: imb-runtime-3
          worker: imb-runtime
          profile: estate-runtime
          operations: [status, mac-generate, mac-verify, key-read, key-public-key, key-sign]
          protectionLevels: [CVM_WRAPPED, CVM_DERIVED]
          since: 2026-10-14
      # NO PRIVATE KEY IN A WORKER SECRET (441 D3): impact-agent's relay and interactions-session keys are keys of this
      # tenant now, and A2A_MASTER_PRIVATE_KEY / A2A_INTERACTIONS_SESSION_PRIVATE_KEY are deleted from its Worker.
      rawDigestGrant: [imb-runtime-3]
      note: "bound with --audiences urn:mcp:server:person --purposes '*' (one KEK purpose per person); 10 logical keys — 8 vault KEKs plus imb-relay and imb-interactions-session, both SIGNING/secp256k1/CVM_WRAPPED, created 2026-10-14"
  conditions:
    - id: 1
      condition: "No shared caller credential — one least-privilege bind-caller per Worker per estate (closes spec 407 D10)"
      status: met
      detail: >-
        impact-agent met 2026-10-11 (two callers). faithnet met 2026-10-14: the vault is
        `demo-mcp-faithnet-vault-5` and the runtime `demo-a2a-faithnet-runtime-6`, each with eleven named
        operations, and the shared `demo-a2a-faithnet` caller bound with operations ["*"] is DISABLED along with
        the nine narrowings tried on the way. Both estates' gates are green with it off (gate:pay-outward,
        gate:vault-record, f1, f2-door, federation-site, projector-freshness, f3-twin).
        WHAT ACTUALLY BLOCKED IT, after a day of wrong guesses: `RAW_32_BYTE_DIGEST`. It is disabled by default in
        faithkms and must be listed EXPLICITLY — a `*` in allowed_signing_purposes does not enable it
        (crates/akcs-auth/src/binding.rs check_signing_purpose), so the old caller had it spelled out and every
        replacement that listed only the typed purposes lost it. The loss was invisible: it surfaced nowhere in the
        Worker's logs and nowhere in the gate's own output, only as `plannerTrace.playbookUnreadable` inside an ask
        reply, after which the run asked "You have no treasury to be paying from" — a credential error wearing a
        domain question's clothes. Operations were never the cause; three attempts added operations and failed.
        RESIDUAL, HALVED 2026-10-14 and the rest explained rather than deferred. `EIP155_TRANSACTION` now exists
        in faithkms (live on the CVM, and the two estate profiles are bound from it), so THE RELAYER no longer
        needs the raw grant: its two acts are the transaction it broadcasts and the paymaster sponsorship digest
        it signs as a message, which `SmartAgentPaymaster` recovers over `toEthSignedMessageHash`
        (`PERSONAL_SIGN_DIGEST`). What still holds RAW_32_BYTE_DIGEST is the INTERACTIONS-SESSION key, and that is
        the truthful label rather than a shortfall: one key signs peer attestations, harness digests, DEL-001
        bound tokens, invocation proofs and userOp hashes through one raw-digest path, and naming them all
        `EIP712` would put a FALSE statement in this operator's own audit row. Removing it means naming the
        purpose per act (`signA2AAction` takes one as of key-custody's next release) and then splitting the
        runtime's credential per key role — ap-home spec 441 W6. Note the audit precision lags the capability:
        until ap-home pins that release, its transactions are labelled with the purpose its signer was built
        with, so `EIP155_TRANSACTION` appears in no row yet. The custody key and the relay key stay deliberately
        separate, so the blast radius of the raw grant is the session-leaf key, not a person's. The
        floor this condition asserts is per-Worker credentials and no key-rotate, key-disable or
        key-schedule-destruction, which "*" wrongly granted.
    - id: 2
      condition: "One tenant per estate; a tenant is never shared and an estate never has two"
      status: met
      detail: "checked by scripts/check-federation.mts over this record"
    - id: 3
      condition: "CVM protection levels only; AZURE_HSM_DIRECT never bound without a named payer"
      status: met
      detail: "protectionLevels above; the check refuses a caller with AZURE_HSM_DIRECT and no billedTo"
    - id: 4
      condition: "The CVM attestation document is published at the operator host and linked from this record"
      status: met
      detail: >-
        MET 2026-10-14, in two halves. THE HOST: kms.faithnet.io is a published-application route on the same
        Cloudflare Tunnel as akcs-pilot, so both answer and nothing broke when it was added; both estates were
        re-pointed and redeployed with every live gate green, and the pilot host is retiring rather than retired.
        THE ATTESTATION: MAA says sevsnpvm · azure-compliant-cvm · is-debuggable false · bootloader/SNP/microcode
        SVN 10/27/88, served at https://kms.faithnet.io/.well-known/attestation (`?format=json` for the claims
        and freshness).
        WHAT WAS LEARNED, because the obvious reading of this condition was wrong twice. First: an earlier note
        here said the CVM has "no outbound network at all". It does have a deliberate allowlist —
        AzureActiveDirectory, AzureKeyVault, AzureAttestation and AzureMonitor on 443 — and what was missing was
        a SNAT path, not permission. Second, and the one that matters: IT NEEDS NEITHER. The vTPM produces the
        report with no network, AMD's KDS serves the VCEK chain publicly, and MAA verifies the AMD signature
        chain inside the report — so who posts it is not part of the claim. The attestation was minted entirely
        without giving the CVM a way out, and the NAT gateway written for this (faithkms infra/bicep,
        `deployNatGateway`) stays default-off and is, on this evidence, unnecessary. It cost about 1.5 cents to
        learn, and would have been $36.50 a month to assume.
        IT IS A DATED STATEMENT. MAA signs for eight hours; the launch measurement it attests changes only with
        the VM image. The endpoint serves an expired token with `fresh: false` rather than hiding it — silence
        is not a safer answer than a stale one that admits it. Re-mint after an image upgrade:
        `npx tsx scripts/mint-cvm-attestation.mts`.

# ── THE UNIVERSAL NAMESPACE (spec 440 §C) ─────────────────────────────────────────────────────────────
# One namespace, rooted on ONE chain the way ENS v2 is rooted on Ethereum L1: the typed roots on the root chain are
# the federation's names. Other chains join without a second registry — an estate's naming gate is named on the
# root's priced roots (`setGate`), its residents own their names on the root chain by their own root-chain account,
# address records are keyed by chain, a reverse claim per chain is honoured only with the forward, and other chains
# resolve by proof or by reading the root chain. No town runs a parallel `.me`. The owner's decision of 2026-10-14;
# it amends docs/architecture/federated-agent-naming.md N7.
naming:
  rootChain: 34348
  rootRegistry: "0x60E949D52660A9D4143ecB0fdA56c0457f20aED9"      # AgentNameRegistry on faithchain (Ring 0 deployments-faithchain.json)
