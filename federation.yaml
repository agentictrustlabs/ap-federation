      rawDigestGrant: [imb-runtime-3, projector-imb]
      note: "bound with --audiences urn:mcp:server:person --purposes '*' (one KEK purpose per person); 10 logical keys — 8 vault KEKs plus imb-relay and imb-interactions-session, both SIGNING/secp256k1/CVM_WRAPPED, created 2026-10-14"
  conditions:
    - id: 1
      condition: "No shared caller credential — one least-privilege bind-caller per Worker per estate (closes spec 407 D10)"
      status: met
      detail: >-
        impact-agent met 2026-10-11 (two callers). faithnet met 2026-10-14: the vault is
        `demo-mcp-faithnet-vault-5` and the runtime `demo-a2a-faithnet-runtime-6`, each with eleven named
        operations, and the shared `demo-a2a-faithnet` caller bound with operations ["*"] is DISABLED along with
        the nine narrowings tried on the way. Both estates' gates are green with it off (gate:pay-outward,
        gate:vault-record, f1, f2-door, federation-site, projector-freshness, f3-twin).
        WHAT ACTUALLY BLOCKED IT, after a day of wrong guesses: `RAW_32_BYTE_DIGEST`. It is disabled by default in
        faithkms and must be listed EXPLICITLY — a `*` in allowed_signing_purposes does not enable it
        (crates/akcs-auth/src/binding.rs check_signing_purpose), so the old caller had it spelled out and every
        replacement that listed only the typed purposes lost it. The loss was invisible: it surfaced nowhere in the
        Worker's logs and nowhere in the gate's own output, only as `plannerTrace.playbookUnreadable` inside an ask
        reply, after which the run asked "You have no treasury to be paying from" — a credential error wearing a
        domain question's clothes. Operations were never the cause; three attempts added operations and failed.
        RESIDUAL, HALVED 2026-10-14 and the rest explained rather than deferred. `EIP155_TRANSACTION` now exists
        in faithkms (live on the CVM, and the two estate profiles are bound from it), so THE RELAYER no longer
        needs the raw grant: its two acts are the transaction it broadcasts and the paymaster sponsorship digest
        it signs as a message, which `SmartAgentPaymaster` recovers over `toEthSignedMessageHash`
        (`PERSONAL_SIGN_DIGEST`). What still holds RAW_32_BYTE_DIGEST is the INTERACTIONS-SESSION key, and that is
        the truthful label rather than a shortfall: one key signs peer attestations, harness digests, DEL-001
        bound tokens, invocation proofs and userOp hashes through one raw-digest path, and naming them all
        `EIP712` would put a FALSE statement in this operator's own audit row. Removing it means naming the
        purpose per act (`signA2AAction` takes one as of key-custody's next release) and then splitting the
        runtime's credential per key role — ap-home spec 441 W6. Note the audit precision lags the capability:
        until ap-home pins that release, its transactions are labelled with the purpose its signer was built
        with, so `EIP155_TRANSACTION` appears in no row yet. The custody key and the relay key stay deliberately
        separate, so the blast radius of the raw grant is the session-leaf key, not a person's. The
        floor this condition asserts is per-Worker credentials and no key-rotate, key-disable or
        key-schedule-destruction, which "*" wrongly granted.
    - id: 2
      condition: "One tenant per estate; a tenant is never shared and an estate never has two"
      status: met
      detail: "checked by scripts/check-federation.mts over this record"
    - id: 3
      condition: "CVM protection levels only; AZURE_HSM_DIRECT never bound without a named payer"
      status: met
      detail: "protectionLevels above; the check refuses a caller with AZURE_HSM_DIRECT and no billedTo"
    - id: 4
      condition: "The CVM attestation document is published at the operator host and linked from this record"
      status: met
      detail: >-
        MET 2026-10-14, in two halves. THE HOST: kms.faithnet.io is a published-application route on the same
        Cloudflare Tunnel as akcs-pilot, so both answer and nothing broke when it was added; both estates were
        re-pointed and redeployed with every live gate green, and the pilot host is retiring rather than retired.
        THE ATTESTATION: MAA says sevsnpvm · azure-compliant-cvm · is-debuggable false · bootloader/SNP/microcode
        SVN 10/27/88, served at https://kms.faithnet.io/.well-known/attestation (`?format=json` for the claims
        and freshness).
        WHAT WAS LEARNED, because the obvious reading of this condition was wrong twice. First: an earlier note
        here said the CVM has "no outbound network at all". It does have a deliberate allowlist —
        AzureActiveDirectory, AzureKeyVault, AzureAttestation and AzureMonitor on 443 — and what was missing was
        a SNAT path, not permission. Second, and the one that matters: IT NEEDS NEITHER. The vTPM produces the
        report with no network, AMD's KDS serves the VCEK chain publicly, and MAA verifies the AMD signature
        chain inside the report — so who posts it is not part of the claim. The attestation was minted entirely
        without giving the CVM a way out, and the NAT gateway written for this (faithkms infra/bicep,
        `deployNatGateway`) stays default-off and is, on this evidence, unnecessary. It cost about 1.5 cents to
        learn, and would have been $36.50 a month to assume.
        IT IS A DATED STATEMENT. MAA signs for eight hours; the launch measurement it attests changes only with
        the VM image. The endpoint serves an expired token with `fresh: false` rather than hiding it — silence
        is not a safer answer than a stale one that admits it. Re-mint after an image upgrade:
        `npx tsx scripts/mint-cvm-attestation.mts`.

# ── THE UNIVERSAL NAMESPACE (spec 440 §C) ─────────────────────────────────────────────────────────────
# One namespace, rooted on ONE chain the way ENS v2 is rooted on Ethereum L1: the typed roots on the root chain are
# the federation's names. Other chains join without a second registry — an estate's naming gate is named on the
# root's priced roots (`setGate`), its residents own their names on the root chain by their own root-chain account,
# address records are keyed by chain, a reverse claim per chain is honoured only with the forward, and other chains
# resolve by proof or by reading the root chain. No town runs a parallel `.me`. The owner's decision of 2026-10-14;
# it amends docs/architecture/federated-agent-naming.md N7.
naming:
  rootChain: 34348
  rootRegistry: "0x9BE6c96F198a7EDaE0Bb80c98A68EB76Cb85a4bC"      # AgentNameRegistry on faithchain (Ring 0 deployments-faithchain.json, generation 4 — 2026-11-11; gen 1 0x60E949D5… is history)
  universalResolver: "0x56B6FBe849356a1D89d024DcA8abf74BF828bF4f" # AgentNameUniversalResolver (generation 4) (the one-chain round trip, spec 222)
  roots: [me, org, team, svc, workspace, treasury, registry, church, circle, household, estate]
  resolver: https://ap-federation.faithnet.io/api/names           # wave 1: over every live town's naming read API; later waves read the root chain and its proofs
  note: "the priced roots' governor is naming.svc under the town clerk persona (ap-town spec 431) — the one trust position a shared root creates; spec 440 C7 names it, Ring 0 decides its council shape"

# ── PROTOCOLS: WHAT AN ESTATE PRESENTS AT COMPANIES' DOORS (spec 443 §2; Ring 0 spec 442) ─────────────────────────────
# Declared per estate; nothing here grants anything. The client at every company's door is the estate's personal-agent
# SERVICE — never a person: a per-person client_id would publish the person's label and estate to every company and is
# refused by `check:federation` and by Ring 0's `check:no-person-client-id`. The person is only a pairwise `sub` derived from
# a secret in her vault (442 §4). Versions are the ones Ring 0's standards lock pins (`pap` · `acp-checkout` · `ucp` ·
# `visa-tap`); this register proposes, Ring 0 pins (439 §10). `status: declared` until pap.svc is chartered (443 W1) and its
# documents serve — the site says "declared", never "live", until a gate has seen them.
protocols:
  - estate: faithnet
    status: live            # 2026-10-16: pap.faithnet.io serves the documents; `gate:pap-twin` green against ligonier's door
    personalAgent:
      # `faithnet-pap.svc` (bought 2026-10-16, 10 SHQ from demo-admin's treasury): the gate's domain rule refused `pap` (pap.com exists).
      service: faithnet-pap.svc@faithnet
      agent: "0xb88420134b1b22485646430399AbbEaBD496e4B2"   # faithnet-pap.svc, generation 4 (re-chartered 2026-11-11 under demo-admin; gen-1 0xf2903860…); vault bound; steward wire recorded
      clientId: https://pap.faithnet.io/client.json
      jwks: https://pap.faithnet.io/jwks.json
      keyDirectory: https://pap.faithnet.io/.well-known/http-message-signatures-directory
      binding: atl:clientKeys
      speaks: { pap: "0.1", acp: "2026-04-17", ucp: "latest", tap: "sample-2026" }
      mediatedSignIn: refused
    companyDoors:
      - agent: ligonier.svc
        poppy: https://ligonier-door.ap-federation.faithnet.io/.well-known/poppy.json   # apps/pap-door (443 W2, live 2026-10-16); ligonier.faithnet.ai is the runtime's wildcard zone
        doorAgent: "0xa8faCe68E4177EF9E16CFf80E8356FaA88287407"   # the door's OWN service agent (chartered 2026-10-16): what knocks at ligonier.svc's A2A door with the parked act
        requiresInvitation: false
        proofGrades: [identity, standing, predicate]
