# ap-federation's register — the neutral ground, and the estates that project onto it (spec 439 F1).
#
# Nothing in this file grants anything. A row says an estate projects a commitment to its live set, and a
# presentation against that root is EVIDENCE: whether the receiving estate lets an agent act is its own
# mandate, verified per step (ADR-0056 / ADR-0057).
federation: faithchain-neutral-ground

# ── NEUTRAL GROUND ────────────────────────────────────────────────────────────────────────────────────
# NEUTRAL IS A PROPERTY OF THE CONTRACT, NOT OF THE CHAIN IT SITS ON. `EstateProjectionRegistry` has no
# admin, no pause and no upgrade, so the account that deployed it holds nothing over it and no estate can
# redeploy the registry it proves itself against. That is the whole claim.
#
# AND THE HONEST LIMIT: this instance sits on faithchain, the one chain we run, beside both estates that
# use it. So what is proven today is CROSS-ESTATE, not cross-chain. The id is `keccak256("eip155:<chainId>:
# <governance>")` — chain-scoped by construction — so an estate on a second chain registers here unchanged
# and the verifier's code does not move; until a second chain exists, nobody may claim it has been shown.
registry:
  chainId: 34348
  chain: faithchain
  address: "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
  deployed: 2026-10-13
  deployTx: script/DeployEstateProjectionRegistry.s.sol (Ring 0 packages/contracts)
  # The RPC is read from this environment variable — never written here (it carries an app token).
  rpcEnv: FEDERATION_RPC_URL
  # Ring 0 `deployments-faithchain.json#estateProjectionRegistry` carries the same address. It is repeated
  # here because the pinned `@agenticprimitives/contracts` release predates the deployment: when a release
  # carries it, this field becomes a cross-check, not a source.
  source: ring-0 deployments-faithchain.json (2026-10-13)

# ── THE ESTATES ───────────────────────────────────────────────────────────────────────────────────────
# `governance` is the address the estate id is derived from, and it is FOREVER: change it and the estate id
# changes, which means re-registering and invalidating every reference a counterparty holds. So it is the
# one identity an estate cannot rotate — its own agent's Smart Agent address (ADR-0010: canonical identity
# persists, credentials rotate). An estate without such an agent is NOT registered here: minting a
# permanent id from a provisional address is the kind of thing nobody can undo.
estates:
  - id: impact-agent
    # TWO CHAINS, TWO FACTS (W4, 2026-10-15). `chainId` is where the estate's PROJECTION anchors and the chain its permanent
    # id derives from (eip155:34348 + the governance agent) — it stays 34348 after the move, because an estate id does not
    # change. `homeChainId` is where its PEOPLE live: their accounts, their Home, their custody, their grants (so revocation
    # is read THERE, over `rpcEnv`). A presenter from this estate signs on 34349; the door verifies the signature on 34349
    # and reads the roots on 34348. Neither chain is "the" chain of the estate; a reader that infers one from the other is wrong.
    chainId: 34348
    homeChainId: 34349
    rpcEnv: HOPECHAIN_RPC_URL
    home: https://www.impact-agent.me
    a2a: https://a2a.impact-agent.io
    governance: "0x4457aadf6ADeB31bA8F166fafcC0d0579ECd1015"
    governanceKind: estate-agent
    governanceName: imbnet.estate          # on-chain: AgentNameRegistry owner of `imbnet.estate`
    # The key that anchors this estate's roots. `register` binds it once; `rotateSigner` moves it. The
    # address is public by construction (the registry stores it); the key is this estate's own secret.
    # THE SIGNER IS THE ESTATE'S REGISTRY AGENT (spec 439 §4, 2026-10-14) — a Smart Agent custodied by a person OF THIS
    # ESTATE (maya, through impact-agent.me), declaring `atl:estate: imbnet.estate`. `signerOf` on neutral ground is
    # this account, so anchoring is an act of the estate's own agent, not of a key somebody holds.
    signer: "0x432FE71eAB5442220Cb0CBb6974f741093De8Bd7"
    signerKind: registry-agent
    signerCustodian: "maya (a person of this estate, via its Home)"
    # The key the projector holds is a DELEGATE under a wire this agent signed: `setRoots` on the registry, nothing
    # else, time-bounded, revocable on chain in one transaction without touching the agent (ADR-0019).
    anchorDelegateKeyEnv: IMPACT_AGENT_PROJECTION_SIGNER
    anchoringWire: .secrets/anchoring-wire-impact-agent.json
    # Revocation is read on the ESTATE'S chain, and this is the contract that answers (Ring 0
    # `deployments-faithchain.json#delegationManager`). No address here means nothing can be pruned, and the
    # projector then refuses to vouch for a set it cannot narrow.
    # The DelegationManager on the HOME chain (deployments-hopechain.json) — the same hex as faithchain's by the deployer's
    # nonces, and a different contract; the profile resolver is the one on the PROJECTION chain, where the estate agent
    # declares its signer (F2.5).
    delegationManager: "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
    # Where the estate agent declares `atl:projectionSigner` (spec 439 F2.5; Ring 0 deployments-faithchain.json#agentProfileResolver).
    profileResolver: "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
    # Its chain endpoint. Omitted = neutral ground's, which is only correct while they share a chain. An
    # estate on a second chain names its own here, and that is the only line that changes for it.
    # WHY A VERIFIER MUST CROSS-CHECK THIS. `register(estateId, signer)` is first-come-wins — public ground
    # cannot verify who governs an estate on another chain, so it cannot refuse a squatter. A verifier that
    # trusts the registry's signer alone trusts whoever registered first. So the estate also declares its
    # signer where its own chain says it: F2 registers an `atl:projectionSigner` predicate in Ring 0's
    # OntologyTermRegistry and the estate agent writes it (a verifier on another chain reads that chain —
    # public data, no trust required). Until then the declaration is this file and ap-town's town.yaml row,
    # both public and reviewed, and the projector prints the gap on every run.
    # DECLARED 2026-10-14: imbnet.estate wrote `atl:projectionSigner` = this signer on its own chain (tx 0x35045e1b…,
    # ap-home scripts/set-projection-signer.mts); `projector status` and the door read it and compare with `signerOf`.
    declaredOnChain: true
    # THE HOME CHAIN HAS ITS OWN REGISTRY AGENT SINCE 2026-10-15 (W9): `0x4eB7D9e5bE8E10a6FC6d0c5360dB937099a1F39F` on hopechain,
    # chartered by maya, holds the vault key the projector's credential (`VAULT_CREDENTIALS_IMPACT_AGENT`) is a leaf under —
    # a vault credential verifies on the chain the vault validates on, which is the home chain now. ANCHORING DID NOT MOVE:
    # `signerOf` on neutral ground is still the faithchain agent above, under the anchoring wire; the estate id derives from
    # `chainId` 34348 and a rotation of the signer is the owner's ceremony (`rotateSigner`), not a side effect of the move.
    homeRegistryAgent: "0x4eB7D9e5bE8E10a6FC6d0c5360dB937099a1F39F"

  - id: faithnet
    chainId: 34348
    homeChainId: 34348
    home: https://www.faithnet.me
    a2a: https://a2a.faithnet.io
    # ON NEUTRAL GROUND SINCE 2026-10-14. faithnet's estate agent is PERSONA-CUSTODIED (the owner's decision: "use a
    # demo user for that agent … a type of .estate for each"): a Smart Agent at salt 2 over the demo-admin persona's
    # key (ap-home scripts/add-estate-agent-persona.mts), named `faithnet.estate` by the deployer (Ring 0
    # AddEstateName, tx 0x200393e4…), its Home in `atl:homepage`, its signer in `atl:projectionSigner`
    # (tx 0xd81334ac…). It is NOT `faith-estate.workspace` — that stays the Pulse's context agent (spec 436 §5.5),
    # one agent per estate typed .estate, one per context typed .workspace. (Proposed, not decided: the Pulse's
    # context agents become the .estate agents — spec 440 §A/ap-town 436.)
    governance: "0x3273f419FDfc7eA1Bf14372C4A9CA5fC43818F64"
    governanceKind: estate-agent
    governanceName: faithnet.estate         # on-chain: AgentNameRegistry owner of `faithnet.estate`
    governanceCustody: "demo-admin persona (demo/personas.local.json), the owner's choice 2026-10-14"
    # As impact-agent: the signer is this estate's registry agent, custodied by demo-admin (a person of this estate),
    # declaring `atl:estate: faithnet.estate`. The projector's key is a revocable delegate under its wire.
    signer: "0xdfdAE0a37D35b72D8E2a4E3464087d43d0eB0b5b"
    signerKind: registry-agent
    signerCustodian: "demo-admin (a person of this estate)"
    anchorDelegateKeyEnv: FAITHNET_PROJECTION_SIGNER
    anchoringWire: .secrets/anchoring-wire-faithnet.json
    delegationManager: "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
    profileResolver: "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
    declaredOnChain: true

# ── THE DOORS (spec 439 F2) ───────────────────────────────────────────────────────────────────────────
# The federation's reference receiving doors — one in front of one estate's A2A door each. A production door is
# the estate's own edge; these are where a foreign presentation reaches an admission receipt today.
doors:
  - estate: impact-agent
    url: https://door.ap-federation.faithnet.io
    target: maya-fernandes.me          # the receiving agent, through the estate's edge-addressed door
    since: 2026-10-14
    # THE `predicate` GRADE (spec 443 W5; Ring 0 zkID Z1–Z4, 2026-10-15): what THIS door asks a credential to prove, in zero
    # knowledge, over which credential layout. The door builds the proof request from this and ITS challenge, never from
    # the presentation; the predicate program's digest is what a holder's `credential.present` wire names. A nullifier
    # (one visit per audience) is required; the issuer's live-credential status is required and read from neutral ground.
    # The verifier is the Node Container beside the door Worker (apps/door/verifier) — the receipt names that placement.
    credentialProofs:
      # zkID Z5 (2026-10-16): "over 18, AND a member of your organization" — the membership is a `member` claim in a
      # credential the ORGANIZATION's own issuer facet issued (imbnet's, `imbnet-membership-issuer` below), proved in the
      # same zero-knowledge presentation; the door learns that its organization issued her a membership and nothing about
      # which member. A credential from another issuer, or one without the claim, proves nothing here.
      predicates:
        - { claim: age, op: gte, value: 18 }
        - { claim: member, op: gte, value: 1 }
      # TWO claims, TWO predicates: the 1k circuit matches at most four patterns (claims + predicates), so the membership
      # layout drops roc_birthday — a door that wants a third claim proves it with the 2k keys (openac-sdk PARAMS_EXCEEDED).
      claimSchema: [age, member]     # the issuer-fixed disclosure order of the accepted credential type (slot = claim)
      vcSize: 1k
      acceptedVersions: ["0.1.0"]          # openac-sdk 5.0.0's bundle `version` (Ring 0 lock `openac-sdk`); bound to the 1k keys
      # One visit per audience PER WINDOW: the asserted nullifier is deterministic per (device key, audience), so the store
      # forgets it after the window and the same holder may return — ZK-POP's epoch-scoped persistence. One hour here, so the
      # nightly gate (and an operator re-running it) is admitted once an hour; a door that means "once, ever" omits the window (a year).
      # TESTING VALUE (2026-10-16): 300 s — long enough to cover one gate run (its reuse twin knocks minutes after the
      # first), short enough to re-run without waiting an hour; no operational users yet.
      # Restore before real users — docs/runbooks/before-real-users.md, item 1. (Changing the window starts a fresh
      # count: the door keys its one-visit store by the window.)
      nullifier: { require: true, grade: asserted, windowSeconds: 300 }
      status: required
      maxAgeSeconds: 86400
      # THE TRUST SET (2026-10-16): the issuers whose facets this door accepts a credential under — by id, from
      # `credentials.issuers`. A presentation under any other facet is refused before a byte of proof is read
      # (`CREDENTIAL_ISSUER_NOT_ACCEPTED`). The organization vouches for its members through ITS issuer; no other
      # issuer's "member" means anything here.
      issuers: [imbnet-membership-issuer, imbnet-org]   # spec 444 W4 — the organization issues its own members' credentials, through its agent
    # RECEIPT RETENTION (2026-10-16): a receipt keeps its parties (the pairwise account, the detail, the references) for
    # this many days — the window in which a dispute could need them — then collapses to kind · effect · codes · decision;
    # its hash in the chain never changes. The door's Worker reads the same number from RECEIPT_FULL_RECORD_DAYS.
    receipts:
      fullRecordDays: 30
    # A MEMBER-GATED PAYMENT (2026-10-16): a visitor who held this door's predicates (over 18 AND a member) may ask for a payment
    # TICKET naming the organization's treasury; she pays from HER treasury under HER mandate (the door spends nothing); `settled`
    # reads the transfer on the chain and records the acceptance beside the predicate admission. The organization's membership
    # treasury is a treasury agent on faithchain chartered 2026-10-16, custodied by maya through www.impact-agent.me.
    membershipPayments:
      payee: "0x94886C8491Cd850A903d8140C3044AA475cf5D9b"
      asset: "0xdae09066a2cc32f6203605619137dcf01a9b49ae"
      symbol: USDC
      decimals: 6
      amount: "5"
      purpose: membership dues
      ticketTtlSeconds: 900
      predicateWindowSeconds: 900
      # Spec 444: an admission earned under THIS issuer's credential pays THIS organization's treasury, on its own chain
      # (a payment is treasury to treasury on one chain). The door reads the issuer from its own admission receipt.
      byIssuer:
        imbnet-org:
          payee: "0x57988d43497Aa8e707Aa650127a84373650399f5"
          asset: "0xBd19d53981677357052EF9768B70929217a6F1F0"
          chainId: 34349
          symbol: USDC
          decimals: 6
          amount: "5"
          purpose: membership dues
  - estate: faithnet
    url: https://door-faithnet.ap-federation.faithnet.io
    target: alice.me
    since: 2026-10-14

# ── CREDENTIALS: THE PREDICATE GRADE, VERIFIER SIDE (spec 443 §2 `credentialProofs` + `issuers`; Ring 0 zkID Z1–Z4) ────
# What the federation's doors can verify and which issuers it lists. Nothing here grants anything: a predicate held is
# EVIDENCE about a credential (never a claim, never the person), and the estate's own mandate still governs every act.
# · suite: Ring 0's one zero-knowledge suite — OpenAC (1/OPENAC raw, SD-JWT-P256 profile): predicates over an SD-JWT, the
#   issuer key hidden in the proof and checked against a spec-304 facet, the device key hidden and holder-bound.
# · backend: openac-sdk at the version Ring 0's standards lock pins; role `verifier` — a federation holds no proving key.
# · verifierPlacement `node`: the 1k Prepare verifying key is 274 MB, so verification runs in a Node Container beside
#   each door Worker, never in the Worker; the door's receipt says so (`verifierPlacement: node:container`).
# · issuerTrust `chain`: a facet is resolved by keyId among the documents listed here, then RE-VERIFIED on the issuer's
#   chain — the SA's signature over the facet hash (UniversalSignatureValidator → ERC-1271) and a live attestation of
#   `credentialType = keccak256("issuer-key-facet")` with that subject and hash. Never a fetch to the issuer.
# · issuers[]: the issuing agent is an organization or a service — NEVER a person (a person's agent holds credentials; it
#   does not issue them), and never an estate's governance agent (its live-credential row `estateIdOf(chainId, sa)` on
#   neutral ground would be the estate's own row). Revocation is the issuer row (`revocationRoot: projection`): the
#   issuer `retire`s a credential and re-anchors; every status presentation built before is stale from then on.
credentials:
  suite: openac-sd-jwt-p256
  backend: { package: openac-sdk, version: "5.0.0", role: verifier }
  verifierPlacement: node
  issuerTrust: chain
  issuers:
    # The reference issuer for `gate:predicate-visitor` (2026-10-15): faithnet's REGISTRY AGENT — the one non-person Smart
    # Agent of the estate with a headless custodian (demo-admin, through www.faithnet.me) and an anchoring wire already
    # (.secrets/anchoring-wire-faithnet.json covers `setRoots` for ANY row the agent signs for, so its issuer row anchors
    # under the same wire). A production issuer is a dedicated `.svc` of the estate; this one proves the mechanism.
    # zkID Z5 (2026-10-16): THE ORGANIZATION'S OWN ISSUER for "a member of your organization" at impact-agent's door —
    # imbnet's REGISTRY AGENT (the estate's org-side issuer; the same shape faithnet's proves), custodied by maya through
    # www.impact-agent.me. It lives on faithchain (the registry agent is faithchain-era), so its facet is attested there and
    # the holder's wire shares the chain. Its credential carries [age, member, roc_birthday]: the org vouches for both.
    # SPEC 444 — the ORGANIZATION issues its members' credentials: imbnet's own organization agent (created 2026-10-16 by
    # maya's Ask at www.impact-agent.me, on hopechain, name deferred), its issuing key in the estate's key service (tenant imb,
    # `issuer-key:imbnet-org-1`, P-256, ES256_ISSUE_SHA256 only). Its revocation row's id is its own (estateIdOf(34349, sa));
    # neutral ground is faithchain, where a hopechain account cannot sign, so the estate's neutral-ground agent anchors the row
    # for it (`rowSigner`) under its anchoring wire — the facet stays the organization's, on its own chain.
    - id: imbnet-org
      estate: impact-agent
      sa: "0x2Ce397435e126e513856D27286248F5497108713"
      chainId: 34349
      kind: organization
      custodian: "maya (steward; via www.impact-agent.me)"
      attestationRegistry: "0x2D5EFeeB87f60244530e0a1ed420755090295cC4"
      universalSignatureValidator: "0xa5855906C0De3813E74BEe201973071e0c844115"
      rpcEnv: HOPECHAIN_RPC_URL
      rowSigner: "0x432FE71eAB5442220Cb0CBb6974f741093De8Bd7"
      anchorDelegateKeyEnv: IMPACT_AGENT_PROJECTION_SIGNER
      anchoringWire: .secrets/anchoring-wire-impact-agent.json
      # Spec 444: the ledger is the ORGANIZATION'S vault (its credential.issue act writes the submission); the scheduled
      # projector re-anchors this row from there, with the rowSigner's delegate key and wire held under this issuer's id.
      ledger: vault
      since: 2026-10-16
      facets:
        - keyId: issuer-key:sd-jwt:imbnet-org-1
          thumbprint: vCB6bQfAt-TFWa4VtDQGSV4wYhgJtNlTO1ldbJ1MdhI
          attestation: "0x1481a28ed868085a683d09dcc7b2e4cce0e8408c92a3ea9ef1266c265b8bb1b2"
          revocationRoot: projection
          document:
            facet: {"type":"IssuerKeyFacetV1","subjectAgent":"0x2ce397435e126e513856d27286248f5497108713","keyId":"issuer-key:sd-jwt:imbnet-org-1","suite":"es256-sd-jwt","publicKeyJwk":{"kty":"EC","crv":"P-256","x":"gUqinqZbBXl9V7FSRy2Wi4lLKBrR3nPQ09QqOUHrvYw","y":"w4pimsOhDf9dBhc-zcfrqdGNsn3kGnLBvWUDe-jOCPY","kid":"vCB6bQfAt-TFWa4VtDQGSV4wYhgJtNlTO1ldbJ1MdhI"},"validFrom":"2026-10-16T16:48:00.293Z"}
            facetHash: sha256:953755a564dfab3878fe1dec1c1313c1e6d5c1707b19231d72053f67b6f6f6b3
            signature: "0xdc126b6df299d1e38ba002d651eb176d9e5e28c169b38457c1366d1c138b44206b2988f5b37e0e192f17b198cef823ef3f3e68486ec99005362ecb002c07e4c71b"
    # THE STAND-IN (decision 2026-10-16, spec 444 §2.2 item 5, option a): the estate's registry agent issues membership
    # credentials for a visitor from ANOTHER estate (alice, faithnet), which the organization's own issuer (imbnet-org,
    # below) cannot do today — cross-estate membership is not built. It stays in the door's trust set for exactly that
    # case and the nightly gates that prove it. Retire it when cross-estate membership lands (option c).
    - id: imbnet-membership-issuer
      estate: impact-agent
      sa: "0x432FE71eAB5442220Cb0CBb6974f741093De8Bd7"
      chainId: 34348
      kind: registry-agent
