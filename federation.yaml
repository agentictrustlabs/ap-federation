      since: 2026-10-16
      # Written by scripts/setup-predicate-issuer.mts (2026-10-16, custodian maya through www.impact-agent.me): the facet is PUBLIC; the
      # attestation (tx 0xfc71fa1a…) on faithchain's AttestationRegistry is what a verifier checks; the issuer row anchored at sequence 2.
      facets:
        - keyId: issuer-key:sd-jwt:imbnet-membership-issuer-1
          thumbprint: CNFguV_FDOnRyMJeVtr51AUYvNt0pjlSrEzDKNa6kfg
          attestation: "0xebaf6600895e5e6e4d4507da4d340b45abec16252c570cbf1b176977e6748a08"
          revocationRoot: projection
          document:
            facet: {"type":"IssuerKeyFacetV1","subjectAgent":"0x432fe71eab5442220cb0cbb6974f741093de8bd7","keyId":"issuer-key:sd-jwt:imbnet-membership-issuer-1","suite":"es256-sd-jwt","publicKeyJwk":{"kty":"EC","crv":"P-256","x":"bRJGs9GPJ6WzrS7bCTy12DI8QDIZzH1pFWwgrYwdH3o","y":"TDyTrcRtsbZ8HwgnkFze7aKhDOzLzkev1cTEGvuPuT8","kid":"CNFguV_FDOnRyMJeVtr51AUYvNt0pjlSrEzDKNa6kfg"},"validFrom":"2026-10-16T00:15:04.594Z"}
            facetHash: sha256:91591d150dea1ea36ffb3166210d10ca43e103d5f65c42f881a63c8ac154d179
