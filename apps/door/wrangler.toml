# The receiving door (spec 439 F2): the federation's reference door in front of ONE receiving estate's A2A door.
# It authenticates the presenter by a principal-signed request proof (UniversalSignatureValidator on the
# presenter's chain), runs the admission engine with the foreign-estate evaluator against roots READ LIVE from
# neutral ground, writes a hash-chained receipt, and forwards admitted bytes to the estate's A2A door with the
# evidence in headers. It admits; it never decides what the agent may do (ADR-0043 / ADR-0056).
#
# The receiving AGENT is maya-fernandes.me (impact-agent) through the estate's edge-addressed door (spec 346 §5: impact-agent
# mints no per-agent hosts). The estate agent has no A2A door of its own, which is why the target is a resident.
# Secrets (never here): FEDERATION_RPC_URL (carries an app token), DOOR_SECRET (challenge tickets + grant MAC).
name = "ap-federation-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "DoorLedgerDO"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DoorLedgerDO"]

[vars]
PUBLIC_ORIGIN = "http://localhost:8787"
BOUNDARY_ID = "ap-federation-door:local"
RECEIVING_ESTATE = "impact-agent"
ORIGIN_A2A = "https://edge.impact-agent.io/api/a2a/maya-fernandes.me"
# W4 (2026-10-15): the receiving agent is maya-fernandes.me, whose account lives on hopechain (her canonical id); the
# faithchain address this said before is her satellite there, which holds her root name and receives nothing.
TARGET_AGENT_ID = "eip155:34349:0x3f96a0b26c59260b4fe74b40726b000b12ef33d3"
TARGET_RUNTIME_ID = "urn:ap:runtime:impact-agent:prod"
CHAIN_ID = "34348"
REGISTRY_ADDRESS = "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
MAX_AGE_SECONDS = "86400"
PROFILE_RESOLVER = "0xB03F7C06ad3274F584AB72794406D639c02A45e1"

[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true

# ── ONE ENV PER RECEIVING ESTATE. `impact-agent` = the first door (Worker `ap-federation-door`, kept — a rename orphans its DO). ──
[env.impact-agent]
name = "ap-federation-door"
routes = [{ pattern = "door.ap-federation.faithnet.io", custom_domain = true }]
[[env.impact-agent.durable_objects.bindings]]
name = "LEDGER"
class_name = "DoorLedgerDO"
[[env.impact-agent.migrations]]
tag = "v1"
new_sqlite_classes = ["DoorLedgerDO"]
[env.impact-agent.vars]
PUBLIC_ORIGIN = "https://door.ap-federation.faithnet.io"
BOUNDARY_ID = "ap-federation-door:impact-agent"
RECEIVING_ESTATE = "impact-agent"
ORIGIN_A2A = "https://edge.impact-agent.io/api/a2a/maya-fernandes.me"
# W4 (2026-10-15): the receiving agent is maya-fernandes.me, whose account lives on hopechain (her canonical id); the
# faithchain address this said before is her satellite there, which holds her root name and receives nothing.
TARGET_AGENT_ID = "eip155:34349:0x3f96a0b26c59260b4fe74b40726b000b12ef33d3"
TARGET_RUNTIME_ID = "urn:ap:runtime:impact-agent:prod"
CHAIN_ID = "34348"
REGISTRY_ADDRESS = "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
MAX_AGE_SECONDS = "86400"
PROFILE_RESOLVER = "0xB03F7C06ad3274F584AB72794406D639c02A45e1"

# ── The door in front of FAITHNET (2026-10-14): the twin's other direction. Receiving agent alice.me through the
# estate's edge-addressed door. Its own Worker, its own DO, its own DOOR_SECRET. ──
[env.faithnet]
name = "ap-federation-door-faithnet"
routes = [{ pattern = "door-faithnet.ap-federation.faithnet.io", custom_domain = true }]
[[env.faithnet.durable_objects.bindings]]
name = "LEDGER"
class_name = "DoorLedgerDO"
[[env.faithnet.migrations]]
tag = "v1"
new_sqlite_classes = ["DoorLedgerDO"]
[env.faithnet.vars]
PUBLIC_ORIGIN = "https://door-faithnet.ap-federation.faithnet.io"
BOUNDARY_ID = "ap-federation-door:faithnet"
RECEIVING_ESTATE = "faithnet"
ORIGIN_A2A = "https://edge.faithnet.io/api/a2a/alice.me"
TARGET_AGENT_ID = "eip155:34348:0xb0d11ce19b756a682e78b4904cd8d832303b3d11"
TARGET_RUNTIME_ID = "urn:ap:runtime:faithnet:prod"
CHAIN_ID = "34348"
REGISTRY_ADDRESS = "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
MAX_AGE_SECONDS = "86400"
PROFILE_RESOLVER = "0xB03F7C06ad3274F584AB72794406D639c02A45e1"
